  <!-- Structured Data: JSON-LD Projects CollectionPage Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "Featured AI Projects",
    "description": "Portfolio of featured artificial intelligence projects by MD Saib Hossain",
    "url": "https://saibhossain.dev/pages/projects/index.html",
    "mainEntity": {
      "@type": "ItemList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "item": {
            "@type": "SoftwareApplication",
            "name": "Self-RAG System",
            "description": "Autonomous RAG with query rewriting, relevance grading, hallucination detection using LangGraph & OpenAI.",
            "applicationCategory": "BusinessApplication"
          }
        },
        {
          "@type": "ListItem",
          "position": 2,
          "item": {
            "@type": "SoftwareApplication",
            "name": "Agentic Interviewer",
            "description": "Autonomous AI interviewer that parses resumes, generates assessments, and conducts stateful technical conversations.",
            "applicationCategory": "BusinessApplication"
          }
        },
        {
          "@type": "ListItem",
          "position": 3,
          "item": {
            "@type": "SoftwareApplication",
            "name": "MedAssist-LLM",
            "description": "Fine-tuned Qwen2.5-0.5B medical QA model optimized for offline inference on iPhone X.",
            "applicationCategory": "MedicalApplication"
          }
        }
      ]
    }
  }
  </script>
  
  <meta name="color-scheme" content="dark light">
  <script>
    (function(){
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.documentElement.setAttribute('data-theme', 'light');
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch(e) {}
    })();
  </script>

  <!-- Preconnect for Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <a href="#main" class="skip-link">Skip to content</a>
  
  <!-- Header Placeholder -->
  <header id="header-placeholder"></header>
  
  <main id="main">
    <!-- Unique Page Header with Animated Background -->

      <div class="header-glow"></div>
      <div class="container">
        <h1 class="gradient-text" id="page-title">Featured Projects</h1>

        <!-- Filter Tabs (Unique to Projects Page) -->
        <div class="project-filters" id="project-filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="agentic">Agentic AI</button>

    <!-- Projects Grid with Masonry-style Layout -->
    <section class="section">

          <div class="loading-state">
            <div class="spinner"></div>
            <p>Loading projects...</p>
          </div>
        </div>
      </div>
    </section>

            <div class="decoration-dot"></div>
            <div class="decoration-dot delay-1"></div>
            <div class="decoration-dot delay-2"></div>
          </div>
        </div>
      </div>
    </section>
