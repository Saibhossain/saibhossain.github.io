<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <title>Volunteering | MD Saib Hossain</title>
  <meta name="description" content="Explore MD Saib Hossain's volunteering contributions, research reviews, and education programs.">

  <meta name="color-scheme" content="dark light">
  <script>
    (function(){
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.documentElement.setAttribute('data-theme', 'light');
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch(e) {}
    })();
  </script>

  <!-- Preconnect for Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="../../assets/images/favicon.svg"/>

  <!-- Global Core Styles -->
  <link rel="stylesheet" href="../../assets/css/base.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="../../assets/css/layout.css" />
  <link rel="stylesheet" href="../../assets/css/animations.css" />

  <!-- Page Specific Styles -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- Global Header Placeholder -->
  <div id="header-placeholder" data-depth="1"></div>

  <main id="main" class="volunteering-page">
    <div class="container">
      
      <!-- Hero Section -->
      <header class="volunteering-hero fade-in-up">
        <div class="volunteering-logo-badge">🤝</div>
        <h1 class="gradient-text" style="font-size: clamp(2.5rem, 5vw, 4rem); margin-bottom: 1rem;">Community & Volunteering</h1>
        <p class="text-muted" style="font-size: 1.25rem; max-width: 700px; margin: 0 auto;">
          Giving back through healthcare informatics advocacy, open-source education, and collaborative clinical research support.
        </p>
      </header>

      <!-- Featured Event Section -->
      <section class="padding-block" aria-labelledby="featured-heading">
        <h2 id="featured-heading" class="section-title">Featured Representation</h2>
        <div id="featured-container" class="featured-container">
          <!-- Dynamically loaded by script.js -->
          <div class="loading-state" style="grid-column: 1 / -1; text-align: center; padding: 3rem;">
            <p class="text-muted">Loading featured initiative...</p>
          </div>
        </div>
      </section>

      <!-- Standard Contributions Section -->
      <section class="padding-block bg-alt" aria-labelledby="contributions-heading">
        <div class="container">
          <h2 id="contributions-heading" class="section-title">Other Contributions</h2>
          <div id="contributions-container" class="contributions-grid">
            <!-- Dynamically loaded by script.js -->
            <div class="loading-state" style="text-align: center; padding: 3rem;">
              <p class="text-muted">Loading contributions...</p>
            </div>
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- Global Footer Placeholder -->
  <div id="footer-placeholder" data-depth="1"></div>

  <!-- Global Scripts -->
  <script src="../../assets/js/core/config.js"></script>
  <script src="../../assets/js/core/utils.js"></script>
  <script src="../../assets/js/core/nav.js"></script>
  
  <!-- Page Specific Script -->
  <script src="script.js"></script>
</body>

</html>
